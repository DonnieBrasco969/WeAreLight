<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember That You Have a Soul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d13;
            --card-bg: rgba(20, 24, 33, 0.75);
            --gold: #dfb873;
            --gold-light: #f7e3b5;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-glow: rgba(223, 184, 115, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Particle background canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        /* Audio Controls */
        .audio-btn {
            background: rgba(223, 184, 115, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }

        .audio-btn:hover {
            background: rgba(223, 184, 115, 0.25);
            box-shadow: 0 0 15px rgba(223, 184, 115, 0.3);
            transform: translateY(-1px);
        }

        /* Title Styling */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--gold-light);
            letter-spacing: 2px;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(223, 184, 115, 0.2);
        }

        /* Card Container */
        .poem-card {
            background: var(--card-bg);
            border: 1px solid rgba(223, 184, 115, 0.2);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        inset 0 0 20px var(--accent-glow);
            margin-bottom: 2rem;
        }

        /* Stanza Styling */
        .stanza {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 2.5rem;
            opacity: 0.15;
            transform: translateY(15px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: blur(3px);
        }

        .stanza.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .stanza:last-child {
            margin-bottom: 0;
        }

        .stanza p {
            margin: 0.2rem 0;
        }

            font-
